<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 260px;
        margin: 0;
        padding: 16px;
        background: #12141a;
        color: #e8eaf0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        font-size: 13px;
        line-height: 1.6;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 16px;
        color: #f0a63c;
      }
      p { margin: 0 0 10px; color: #969db0; }
      ol { margin: 0; padding-inline-start: 18px; color: #969db0; }
      li { margin-bottom: 4px; }
      .note {
        margin-top: 12px;
        padding: 9px 10px;
        border-radius: 8px;
        background: rgba(240, 166, 60, 0.1);
        border: 1px solid rgba(240, 166, 60, 0.25);
        color: #d8c9a8;
        font-size: 11.5px;
      }
    </style>
  </head>
  <body>
    <h1>ChordAI</h1>
    <p>אקורדים בזמן אמת לשירים ביוטיוב.</p>
    <ol>
      <li>פתח שיר ביוטיוב</li>
      <li>התיבה תופיע בפינה</li>
      <li>אפשר לגרור אותה לכל מקום</li>
    </ol>
    <div class="note">
      הזיהוי רץ כאן בדפדפן, על המחשב שלך. שום דבר לא נשלח לשום שרת.
    </div>
  </body>
</html>
